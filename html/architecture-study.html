<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent 架构学习 — 从 Smallville 到 Claude Code 的工程实践</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --bg2: #1a1d27; --bg3: #242837; --border: #2d2d3a;
      --text: #e2e8f0; --muted: #8b95a5; --accent: #a78bfa;
      --blue: #60a5fa; --green: #34d399; --red: #f87171; --orange: #fb923c;
      --yellow: #fbbf24; --cyan: #22d3ee; --pink: #f472b6;
      --code-bg: #161b22;
    }
    html { scroll-behavior: smooth; }
    body { font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); line-height: 1.75; }

    /* Hero */
    .hero { background: linear-gradient(135deg, #1a0a2e 0%, #0f1117 40%, #0a1628 70%, #0d1520 100%); padding: 64px 24px 52px; text-align: center; border-bottom: 1px solid var(--border); position: relative; overflow: hidden; }
    .hero::before { content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle at 30% 50%, rgba(167,139,250,0.05) 0%, transparent 50%), radial-gradient(circle at 70% 50%, rgba(96,165,250,0.04) 0%, transparent 50%); pointer-events: none; }
    .hero::after { content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 120px; background: linear-gradient(to top, var(--bg), transparent); pointer-events: none; }
    .hero h1 { font-size: clamp(22px, 3.5vw, 36px); color: var(--cyan); margin-bottom: 14px; position: relative; letter-spacing: -0.5px; }
    .hero .sub { color: var(--muted); font-size: 14.5px; max-width: 880px; margin: 0 auto; line-height: 1.85; position: relative; }

    .container { max-width: 1100px; margin: 0 auto; padding: 36px 24px 80px; }
    #p5 .container, #p6 .container { max-width: 1200px; }

    /* Section */
    .section { margin-bottom: 60px; }
    .sec-head { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; padding-bottom: 10px; border-bottom: 2px solid var(--border); }
    .sec-num { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #0f1117; flex-shrink: 0; }
    .sec-head h2 { font-size: 20px; font-weight: 600; }
    h3 { font-size: 16px; color: var(--accent); margin: 28px 0 10px; font-weight: 600; }
    h4 { font-size: 14.5px; color: var(--blue); margin: 20px 0 8px; font-weight: 600; }
    p, li { margin-bottom: 10px; font-size: 14.5px; }
    ul, ol { padding-left: 22px; margin-bottom: 14px; }
    li { margin-bottom: 6px; }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    strong { color: var(--text); }

    /* Highlights */
    .hl { background: rgba(251,191,36,0.12); color: var(--yellow); padding: 1px 5px; border-radius: 3px; font-weight: 500; }
    .hl-accent { background: rgba(167,139,250,0.12); color: var(--accent); padding: 1px 5px; border-radius: 3px; font-weight: 500; }
    .hl-green { background: rgba(52,211,153,0.12); color: var(--green); padding: 1px 5px; border-radius: 3px; font-weight: 500; }
    .hl-cyan { background: rgba(34,211,238,0.12); color: var(--cyan); padding: 1px 5px; border-radius: 3px; font-weight: 500; }
    .hl-blue { background: rgba(96,165,250,0.12); color: var(--blue); padding: 1px 5px; border-radius: 3px; font-weight: 500; }
    .hl-red { background: rgba(248,113,113,0.12); color: var(--red); padding: 1px 5px; border-radius: 3px; font-weight: 500; }
    .hl-orange { background: rgba(251,146,60,0.12); color: var(--orange); padding: 1px 5px; border-radius: 3px; font-weight: 500; }

    /* Callout */
    .callout { border-radius: 10px; padding: 16px 20px; margin: 16px 0 20px; font-size: 14px; line-height: 1.85; }
    .callout-key { background: rgba(167,139,250,0.08); border-left: 3px solid var(--accent); }
    .callout-insight { background: rgba(34,211,238,0.06); border-left: 3px solid var(--cyan); }
    .callout-warn { background: rgba(251,146,60,0.08); border-left: 3px solid var(--orange); }
    .callout-green { background: rgba(52,211,153,0.06); border-left: 3px solid var(--green); }
    .callout-red { background: rgba(248,113,113,0.06); border-left: 3px solid var(--red); }
    .callout-blue { background: rgba(96,165,250,0.06); border-left: 3px solid var(--blue); }
    .callout-good { background: rgba(52,211,153,0.06); border-left: 3px solid var(--green); }
    .callout .callout-title { font-weight: 600; margin-bottom: 6px; font-size: 13.5px; }
    .callout code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; font-size: 13px; font-family: "SF Mono", "Fira Code", monospace; }

    /* Card */
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; transition: border-color 0.2s; }
    .card:hover { border-color: var(--accent); }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .card-body { font-size: 13.5px; color: #c9d1d9; line-height: 1.75; }

    /* Code block */
    .code-block { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin: 14px 0 18px; overflow-x: auto; font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace; font-size: 13px; line-height: 1.7; color: #c9d1d9; }
    .code-block .code-title { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    .code-block .kw { color: var(--accent); }
    .code-block .fn { color: var(--blue); }
    .code-block .str { color: var(--green); }
    .code-block .cmt { color: #6a737d; font-style: italic; }
    .code-block .op { color: var(--orange); }
    .code-block .type { color: var(--cyan); }
    .code-block .num { color: var(--orange); }
    .code-block .arrow { color: var(--cyan); }
    code { background: var(--bg3); padding: 1px 6px; border-radius: 4px; font-size: 12.5px; font-family: "JetBrains Mono", "SF Mono", "Fira Code", Consolas, monospace; }

    /* VS card */
    .vs-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0; margin: 16px 0 24px; align-items: stretch; }
    .vs-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
    .vs-card .vs-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; font-weight: 700; }
    .vs-card ul { padding-left: 18px; }
    .vs-divider { display: flex; align-items: center; justify-content: center; padding: 0 12px; font-size: 20px; font-weight: 800; color: var(--orange); }

    /* Stat boxes */
    .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 16px 0 24px; }
    .stat-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; }
    .stat-box .stat-val { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
    .stat-box .stat-label { font-size: 12px; color: var(--muted); }
    .stat-box .num { font-size: 28px; font-weight: 700; line-height: 1.2; }
    .stat-box .label { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* Table */
    .table-wrap { overflow-x: auto; margin: 16px 0 24px; border-radius: 10px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th { background: var(--bg3); color: var(--accent); font-weight: 600; text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(167,139,250,0.03); }
    .td-highlight { background: rgba(167,139,250,0.06); }

    /* Layer stack */
    .layer-stack { margin: 16px 0 24px; }
    .layer-item { display: flex; align-items: stretch; margin-bottom: 2px; }
    .layer-badge { width: 110px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #0f1117; border-radius: 8px 0 0 8px; text-align: center; padding: 14px 8px; }
    .layer-content { flex: 1; background: var(--bg2); border: 1px solid var(--border); border-left: none; border-radius: 0 8px 8px 0; padding: 12px 16px; font-size: 13px; line-height: 1.7; }

    /* Detail cards */
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin: 16px 0 24px; }
    .detail-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; position: relative; overflow: hidden; }
    .detail-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
    .detail-card.dc-purple::before { background: linear-gradient(90deg, var(--accent), var(--pink)); }
    .detail-card.dc-blue::before { background: linear-gradient(90deg, var(--blue), var(--cyan)); }
    .detail-card.dc-green::before { background: linear-gradient(90deg, var(--green), var(--cyan)); }
    .detail-card.dc-orange::before { background: linear-gradient(90deg, var(--orange), var(--yellow)); }
    .detail-card.dc-red::before { background: linear-gradient(90deg, var(--red), var(--orange)); }
    .detail-card.dc-cyan::before { background: linear-gradient(90deg, var(--cyan), var(--blue)); }
    .detail-card .dc-title { font-weight: 700; font-size: 15px; margin-bottom: 8px; }
    .detail-card .dc-desc { font-size: 13px; color: #c9d1d9; line-height: 1.7; }
    .detail-card ul { padding-left: 16px; margin-top: 6px; }
    .detail-card li { font-size: 13px; color: #c9d1d9; margin-bottom: 4px; }

    /* Flow arrows */
    .flow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 16px 0 20px; }
    .flow-step { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 500; }
    .flow-arrow { color: var(--accent); font-size: 18px; }

    /* Route cards */
    .route-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; position: relative; overflow: hidden; }
    .route-card::before { content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 4px; }
    .route-card.rc-purple::before { background: var(--accent); }
    .route-card.rc-blue::before { background: var(--blue); }
    .route-card.rc-green::before { background: var(--green); }
    .route-card.rc-orange::before { background: var(--orange); }
    .route-card.rc-cyan::before { background: var(--cyan); }
    .route-card.rc-red::before { background: var(--red); }
    .route-card.rc-yellow::before { background: var(--yellow); }
    .route-card .route-num { position: absolute; top: 16px; right: 20px; font-size: 48px; font-weight: 800; color: rgba(255,255,255,0.03); line-height: 1; }
    .route-card .route-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .route-card .route-entry { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; font-family: "SF Mono", "Fira Code", monospace; }
    .route-card .route-desc { font-size: 13.5px; line-height: 1.75; color: #c9d1d9; }
    .route-card .route-focus { margin-top: 10px; }
    .route-card .route-focus li { font-size: 13px; color: #c9d1d9; }
    .route-card .route-sv { background: rgba(96,165,250,0.06); border: 1px solid rgba(96,165,250,0.15); border-radius: 8px; padding: 10px 14px; margin-top: 12px; font-size: 12.5px; line-height: 1.7; color: var(--blue); }
    .route-card .route-sv::before { content: "Smallville \5BF9\5E94"; display: block; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; margin-bottom: 4px; opacity: 0.7; }

    /* Compression level cards */
    .level-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 10px; position: relative; overflow: hidden; }
    .level-card::before { content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 4px; }
    .level-card.lv-1::before { background: var(--green); }
    .level-card.lv-2::before { background: var(--cyan); }
    .level-card.lv-3::before { background: var(--blue); }
    .level-card.lv-4::before { background: var(--orange); }
    .level-card.lv-5::before { background: var(--red); }
    .level-label { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
    .level-desc { font-size: 13px; color: #c9d1d9; line-height: 1.7; }
    .level-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* Memory type cards */
    .mem-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 12px; }
    .mem-card .mem-type { font-weight: 700; font-size: 15px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .mem-card .mem-type .mem-badge { font-size: 11px; border-radius: 6px; padding: 2px 10px; font-weight: 600; }

    /* Phase cards */
    .phase-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 16px 0 24px; }
    .phase-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; position: relative; overflow: hidden; }
    .phase-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
    .phase-card.ph-1::before { background: var(--cyan); }
    .phase-card.ph-2::before { background: var(--blue); }
    .phase-card.ph-3::before { background: var(--accent); }
    .phase-card.ph-4::before { background: var(--orange); }
    .phase-num { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .phase-title { font-weight: 700; font-size: 15px; margin-bottom: 8px; }
    .phase-desc { font-size: 13px; color: #c9d1d9; line-height: 1.7; }

    /* Transition cards */
    .trans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin: 16px 0 24px; }
    .trans-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; }
    .trans-num { font-size: 28px; font-weight: 800; color: var(--accent); opacity: 0.6; flex-shrink: 0; width: 40px; text-align: center; }
    .trans-body { flex: 1; }
    .trans-from { font-size: 13px; color: var(--muted); }
    .trans-arrow-text { font-size: 12px; color: var(--accent); margin: 2px 0; }
    .trans-to { font-size: 13px; color: var(--text); font-weight: 600; }

    /* Quote block */
    .quote-block { background: var(--bg2); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; padding: 16px 20px; margin: 16px 0 20px; font-style: italic; color: #c9d1d9; font-size: 13.5px; line-height: 1.9; }
    .quote-block .quote-src { font-style: normal; color: var(--muted); font-size: 12px; margin-top: 8px; }

    .footer { text-align: center; color: var(--muted); font-size: 12px; padding: 32px 24px; border-top: 1px solid var(--border); margin-top: 40px; line-height: 1.8; }

    /* Cross-ref */
    .cross-ref { max-width: 1100px; margin: 12px auto 0; padding: 8px 24px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; }
    .cross-ref-label { color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
    .cross-ref a { color: var(--blue); text-decoration: none; padding: 3px 10px; border-radius: 6px; background: rgba(96,165,250,0.08); border: 1px solid rgba(96,165,250,0.2); transition: all .15s; }
    .cross-ref a:hover { background: rgba(96,165,250,0.15); text-decoration: none; }

    /* Academic link */
    .academic-link { background: rgba(96,165,250,0.06); border: 1px solid rgba(96,165,250,0.2); border-radius: 8px; padding: 14px 18px; margin-top: 12px; font-size: 13.5px; line-height: 1.8; }
    .academic-link::before { content: "\5B66\672F\5BF9\5E94"; display: block; font-weight: 600; color: var(--blue); margin-bottom: 4px; font-size: 12px; letter-spacing: 0.5px; }

    /* Evolution diagram */
    .evo-container { margin: 24px 0 32px; }
    .evo-era { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-bottom: 0; position: relative; }
    .evo-era:first-child { border-radius: 12px 12px 0 0; }
    .evo-era:last-child { border-radius: 0 0 12px 12px; }
    .evo-era:not(:last-child) { border-bottom: none; }
    .evo-era-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
    .evo-era-badge { font-size: 11px; border-radius: 6px; padding: 3px 10px; font-weight: 600; }
    .evo-items { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
    .evo-item { background: var(--bg3); border-radius: 8px; padding: 10px 14px; font-size: 12.5px; line-height: 1.6; }
    .evo-item .evo-label { font-weight: 600; display: block; margin-bottom: 2px; }
    .evo-connector { text-align: center; padding: 12px 0; background: var(--bg2); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    .evo-connector-arrow { display: inline-block; width: 40px; height: 40px; line-height: 40px; border-radius: 50%; font-size: 18px; font-weight: 700; }
    .advice-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-bottom: 14px; }
    .advice-card .advice-who { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
    .advice-card .advice-body { font-size: 13.5px; line-height: 1.8; color: #c9d1d9; }

    /* Tier, score, barrier, flywheel, advantage, recommendation, combo (from 07) */
    .tier-group { margin: 16px 0 20px; }
    .tier-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; padding: 6px 14px; border-radius: 6px; display: inline-block; margin-bottom: 12px; }
    .tier-1 .tier-label { background: rgba(167,139,250,0.15); color: var(--accent); }
    .tier-2 .tier-label { background: rgba(96,165,250,0.15); color: var(--blue); }
    .tier-3 .tier-label { background: rgba(251,146,60,0.15); color: var(--orange); }
    .tier-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .tier-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; position: relative; overflow: hidden; }
    .tier-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
    .tier-card.tc-purple::before { background: linear-gradient(90deg, var(--accent), var(--pink)); }
    .tier-card.tc-blue::before { background: linear-gradient(90deg, var(--blue), var(--cyan)); }
    .tier-card.tc-green::before { background: linear-gradient(90deg, var(--green), var(--cyan)); }
    .tier-card.tc-orange::before { background: linear-gradient(90deg, var(--orange), var(--yellow)); }
    .tier-card.tc-red::before { background: linear-gradient(90deg, var(--red), var(--orange)); }
    .tier-card.tc-cyan::before { background: linear-gradient(90deg, var(--cyan), var(--blue)); }
    .tier-card.tc-yellow::before { background: linear-gradient(90deg, var(--yellow), var(--orange)); }
    .tier-card .tc-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .tier-card .tc-company { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .tier-card .tc-desc { font-size: 13px; color: #c9d1d9; line-height: 1.7; }
    .score-table thead th { text-align: center; }
    .score-table thead th:first-child { text-align: left; }
    .score-table tbody td { text-align: center; font-variant-numeric: tabular-nums; }
    .score-table tbody td:first-child { text-align: left; }
    .score-table tbody tr:last-child td { font-weight: 700; font-size: 14px; border-top: 2px solid var(--accent); }
    .score-10 { color: var(--green); font-weight: 700; }
    .score-9 { color: var(--cyan); font-weight: 600; }
    .score-8 { color: var(--blue); font-weight: 600; }
    .score-7 { color: var(--accent); }
    .score-6 { color: var(--yellow); }
    .score-5 { color: var(--orange); }
    .score-low { color: var(--red); }
    .barrier-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; position: relative; overflow: hidden; }
    .barrier-card::before { content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 4px; }
    .barrier-card.bar-1::before { background: linear-gradient(to bottom, var(--accent), var(--cyan)); }
    .barrier-card.bar-2::before { background: linear-gradient(to bottom, var(--green), var(--blue)); }
    .barrier-card.bar-3::before { background: linear-gradient(to bottom, var(--orange), var(--yellow)); }
    .barrier-title { font-size: 17px; font-weight: 700; margin-bottom: 12px; }
    .barrier-num { font-size: 48px; font-weight: 800; color: rgba(255,255,255,0.03); position: absolute; top: 12px; right: 20px; line-height: 1; }
    .flywheel { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 16px 0 20px; }
    .flywheel-step { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font-size: 12.5px; font-weight: 500; }
    .flywheel-arrow { color: var(--accent); font-size: 16px; flex-shrink: 0; }
    .adv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin: 16px 0 24px; }

<!-- Tab Switching JS -->
<script>
document.querySelectorAll('.arch-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.arch-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.arch-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.panel).classList.add('active');
    window.scrollTo(0, 0);
    // Re-trigger iframe height calculation for the newly shown panel
    const iframe = document.getElementById(tab.dataset.panel).querySelector('iframe');
    if (iframe && iframe.contentDocument && iframe.contentDocument.body) {
      iframe.style.height = iframe.contentDocument.body.scrollHeight + 'px';
    }
  });
});

// Auto-resize iframes when they load
window.addEventListener('load', () => {
  document.querySelectorAll('.arch-panel iframe').forEach(iframe => {
    try {
      if (iframe.contentDocument && iframe.contentDocument.body) {
        iframe.style.height = iframe.contentDocument.body.scrollHeight + 'px';
      }
    } catch(e) {}
  });
});
</script>
